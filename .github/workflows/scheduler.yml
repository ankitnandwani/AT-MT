name: Money Tree

on:
  schedule:
    - cron: "30 12 * * 1-5"   # Every weekday at 6 PM IST
  workflow_dispatch:          # Allow manual run too

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        run: python money_tree.py
